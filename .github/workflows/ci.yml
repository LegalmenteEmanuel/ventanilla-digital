name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Valores ficticios: el build no se conecta a nada, sólo necesita que las
  # variables existan para que Prisma y Auth.js no aborten.
  DATABASE_URL: postgresql://vd:vd@localhost:5432/ventanilla
  REDIS_URL: redis://localhost:6379
  AUTH_SECRET: ci-placeholder-secret
  PUBLIC_BASE_URL: http://localhost:3000

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Genera el cliente Prisma y compila los paquetes.
      - run: pnpm build

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
