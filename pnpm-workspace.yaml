packages:
  - 'apps/*'
  - 'packages/*'

# Ejecuta los scripts con bash (no cmd.exe) para que `pnpm -r run ...` y los
# scripts encadenados funcionen igual en Windows (Git Bash), Linux y CI.
scriptShell: bash

# Dependencias autorizadas a ejecutar scripts de instalación (postinstall).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  '@tailwindcss/oxide': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # Acelerador nativo opcional de msgpackr (bullmq); el fallback JS basta.
  msgpackr-extract: false
